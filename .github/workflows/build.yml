name: Build

on:
  push:
    branches: [main, 'ios/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64 -DORIGINALENGINE_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (initialize SDL and render one frame)
        run: .\\build\\Release\\originalengine_app.exe --smoke-test

      - name: Run camera unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-Windows-x64
          path: |
            build/Release/originalengine_app.exe
            build/Release/SDL3.dll
            build/Release/assets/demo.obj
            build/Release/assets/demo_texture.ppm
          if-no-files-found: error
          retention-days: 14

  ios-unsigned-ipa:
    name: iOS Device / Unsigned IPA
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Record Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | tr '\\n' '-')" >> "$GITHUB_OUTPUT"

      # Reuse SDL3's pinned source and Xcode's compiled intermediates.
      # The fallback key lets a changed commit reuse the previous build.
      - name: Cache iOS build data
        uses: actions/cache@v4
        with:
          path: |
            build-ios/_deps/sdl3-src
            build-ios/DerivedData/Build
            build-ios/DerivedData/ModuleCache.noindex
          key: ios-deriveddata-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'shaders/**') }}
          restore-keys: |
            ios-deriveddata-${{ runner.os }}-${{ steps.xcode-version.outputs.version }}-
            ${{ runner.os }}-sdl3-release-3.2.10

      - name: Configure iOS Device
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DORIGINALENGINE_BUILD_APP=ON
          -DBUILD_TESTING=OFF
          -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build unsigned iOS app
        run: >-
          cmake --build build-ios --config Release --parallel
          -- -sdk iphoneos
          -derivedDataPath "${{ github.workspace }}/build-ios/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p ipa/Payload
          APP_PATH="$(find build-ios -type d -name originalengine_app.app -print -quit)"
          test -n "$APP_PATH"
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          /usr/bin/zip -qry GasolineEngine-iOS-unsigned.ipa Payload

      - name: Verify IPA
        run: |
          test -s ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -t ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -l ipa/GasolineEngine-iOS-unsigned.ipa
          /usr/bin/unzip -Z1 ipa/GasolineEngine-iOS-unsigned.ipa | grep -q '^Payload/originalengine_app.app/Info.plist$'
          /usr/bin/unzip -Z1 ipa/GasolineEngine-iOS-unsigned.ipa | grep -q '^Payload/originalengine_app.app/originalengine_app$'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-iOS-unsigned-IPA
          path: ipa/GasolineEngine-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
