name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64 -DORIGINALENGINE_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel
