name: Build

on:
  push:
    branches: [main, 'ios/**']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -S . -B build -A x64 -DORIGINALENGINE_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (initialize SDL and render one frame)
        run: .\\build\\Release\\originalengine_app.exe --smoke-test

      - name: Run camera unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-Windows-x64
          path: |
            build/Release/originalengine_app.exe
            build/Release/SDL3.dll
            build/Release/assets/demo.obj
            build/Release/assets/demo_texture.ppm
          if-no-files-found: error
          retention-days: 14

  ios-simulator:
    name: iOS Simulator / Xcode
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Configure iOS Simulator
        run: >-
          cmake -S . -B build-ios -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphonesimulator
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DORIGINALENGINE_BUILD_APP=ON
          -DBUILD_TESTING=OFF

      - name: Build iOS Simulator app
        run: cmake --build build-ios --config Release --parallel

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: GasolineEngine-iOS-Simulator
          path: build-ios/Release-iphonesimulator/originalengine_app.app
          if-no-files-found: error
          retention-days: 14
